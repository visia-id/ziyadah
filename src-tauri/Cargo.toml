[package]
name = "ziyadah"
version = "0.0.1"
description = "Ziyadah: aplikasi Qur'an desktop"
authors = ["Untung Kasirin"]
license = "MIT"
edition = "2021"

[lib]
name = "ziyadah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Audio diputar di inti Rust, bukan di WebView, supaya tidak terikat ke satu jendela.
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
