[package]
name = "ziyadah"
version = "0.0.13"
description = "Ziyadah: aplikasi Qur'an desktop"
authors = ["Untung Kasirin"]
license = "MIT"
edition = "2021"

[lib]
name = "ziyadah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Audio diputar di inti Rust, bukan di WebView, supaya tidak terikat ke satu jendela.
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Membaca quran.db (read-only). "bundled" menyertakan SQLite sehingga tidak bergantung pada sistem.
rusqlite = { version = "0.32", features = ["bundled"] }
# Hanya satu Ziyadah yang berjalan; membuka lagi memunculkan jendela yang sudah ada (F1-19).
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Kontrol media OS: tombol media keyboard/headset, kontrol media Windows (SMTC), Now Playing macOS (F1-10).
souvlaki = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
